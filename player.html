<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Liar's Bar - Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0a0505; color: white;
            height: 100dvh;
            overflow: hidden; display: flex; flex-direction: column;
            background-image: radial-gradient(circle at center, #1a0505 0%, #000 100%);
            touch-action: manipulation;
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: rgba(0,0,0,0.9); border-bottom: 2px solid #451a03; height: 85px; flex-shrink: 0; z-index: 20; padding-top: env(safe-area-inset-top, 10px); }
        .room-pin { font-family: monospace; color: #888; font-size: 1.1rem; background: #111; padding: 5px 10px; border-radius: 8px; border: 1px solid #333; cursor: pointer; }
        .room-pin:active { color: #fff; border-color: #f59e0b; }

        .turn-indicator { flex: 1; text-align: center; font-size: 1.2rem; font-weight: bold; }
        .turn-indicator .highlight { color: #f59e0b; font-size: 1.4rem; text-shadow: 0 0 10px rgba(245,158,11,0.6); }
        .turn-indicator.my-turn .highlight { color: #10b981; text-shadow: 0 0 10px rgba(16,185,129,0.6); }

        .target-box { display: flex; align-items: center; gap: 10px; background: #3f1808; padding: 5px 15px; border-radius: 12px; border: 1px solid #f59e0b; }
        .target-img-container { width: 35px; height: 50px; display: flex; justify-content: center; align-items: center; }
        .target-img-container img { width: 100%; height: 100%; object-fit: contain; border-radius: 3px; animation: glowTarget 1.5s infinite alternate; border: 1px solid #fff; }
        @keyframes glowTarget { from { filter: drop-shadow(0 0 2px #f59e0b); } to { filter: drop-shadow(0 0 8px #f59e0b); transform: scale(1.05); } }

        .arena { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; width: 100%; padding: 20px; }
        .table { width: 60vmin; height: 60vmin; max-width: 400px; max-height: 400px; background: radial-gradient(circle, #065f46 0%, #022c22 100%); border-radius: 50%; border: 12px solid #451a03; box-shadow: inset 0 0 40px rgba(0,0,0,0.8), 0 20px 50px rgba(0,0,0,0.7); position: relative; display: flex; justify-content: center; align-items: center; z-index: 1; }
        .discard-pile { position: absolute; width: 60px; height: 85px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .thrown-card { position: absolute; width: 60px; height: 85px; background-image: url('https://deckofcardsapi.com/static/img/back.png'); background-size: contain; background-repeat: no-repeat; background-position: center; border-radius: 4px; box-shadow: 2px 2px 8px rgba(0,0,0,0.8); top: 0; left: 0; }

        .player-seat { position: absolute; width: 90px; display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -50%); z-index: 10; }
        .avatar-container { position: relative; width: 55px; height: 55px; display: flex; justify-content: center; align-items: center; }
        .avatar { width: 100%; height: 100%; background: #1f2937; border-radius: 50%; border: 3px solid #4b5563; display: flex; justify-content: center; align-items: center; font-size: 24px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 2; transition: all 0.3s; }
        .p-name { background: rgba(0,0,0,0.9); padding: 3px 10px; border-radius: 10px; font-size: 0.8rem; margin-top: -8px; z-index: 3; border: 1px solid #444; white-space: nowrap; max-width: 90px; overflow: hidden; text-overflow: ellipsis; font-weight: bold; }
        .p-gun { font-size: 0.75rem; color: #ef4444; background: #111; padding: 2px 6px; border-radius: 4px; margin-top: 4px; font-weight: bold; border: 1px solid #333; }

        .active-turn .avatar { border-color: #f59e0b; transform: scale(1.2); box-shadow: 0 0 25px #f59e0b; }
        .active-turn .p-name { color: #f59e0b; border-color: #f59e0b; }
        .is-me .avatar { border-color: #3b82f6; background: #1e3a8a; }
        .dead { opacity: 0.4; filter: grayscale(100%); }
        .dead .p-name { text-decoration: line-through; color: #666; }
        .flying-card-anim { position: absolute; width: 60px; height: 85px; border-radius: 4px; z-index: 100; transition: all 0.4s ease-out; box-shadow: 0 15px 30px rgba(0,0,0,0.8); }

        .bottom-area { background: #110808; border-top: 2px solid #333; display: flex; flex-direction: column; align-items: center; padding-top: 15px; z-index: 20; height: 210px; flex-shrink: 0; position: relative; padding-bottom: env(safe-area-inset-bottom, 10px); }
        .controls { display: flex; gap: 15px; margin-bottom: 10px; width: 90%; max-width: 500px; }
        .btn { flex: 1; padding: 12px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; color: white; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(100%); }
        .btn-play { background: linear-gradient(135deg, #2563eb, #1e3a8a); border-bottom: 4px solid #172554; }
        .btn-liar { background: linear-gradient(135deg, #dc2626, #7f1d1d); border-bottom: 4px solid #450a0a; }

        .my-hand { height: 110px; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 10px; width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .hand-card { min-width: 65px; max-width: 75px; aspect-ratio: 5/7; margin-left: -30px; cursor: pointer; transition: 0.2s; position: relative; flex-shrink: 0; }
        .hand-card:first-child { margin-left: 0; }
        .hand-card img { width: 100%; height: 100%; object-fit: contain; border-radius: 5px; box-shadow: -3px 0 10px rgba(0,0,0,0.8); display: block; background: #fff; }
        .hand-card.selected { transform: translateY(-20px); z-index: 50; }
        .hand-card.selected img { outline: 3px solid #f59e0b; box-shadow: 0 10px 20px rgba(245,158,11,0.6); }
        .spectator-mode { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 60; display: none; flex-direction: column; justify-content: center; align-items: center; border-top: 2px solid #dc2626; }
        .spectator-mode h2 { color: #ef4444; font-size: 2rem; margin: 0; text-shadow: 0 0 15px #000; }
        .spectator-mode p { color: #aaa; font-size: 1rem; margin-top: 5px; }

        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(5,5,5,0.95); z-index: 200; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; backdrop-filter: blur(5px); }

        .lobby-box { background: #1a1a1a; padding: 25px; border-radius: 20px; border: 1px solid #333; width: 90%; max-width: 600px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .room-code-display { font-size: 4rem; font-weight: 900; color: #dc2626; letter-spacing: 5px; margin: 10px 0; font-family: monospace; cursor: pointer; transition: 0.2s; }
        .room-code-display:active { transform: scale(0.95); color: #fff; }
        .copy-hint { font-size: 0.8rem; color: #666; margin-bottom: 20px; }
        .players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 15px; margin: 20px 0; max-height: 300px; overflow-y: auto; }
        .lobby-player { display: flex; flex-direction: column; align-items: center; }
        .lobby-avatar { width: 50px; height: 50px; background: #333; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 2px solid #555; font-size: 24px; }
        .lobby-name { font-size: 0.8rem; margin-top: 5px; color: #ccc; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .start-btn { padding: 15px 40px; font-size: 1.5rem; background: linear-gradient(#16a34a, #15803d); color: white; border: none; border-radius: 12px; cursor: pointer; border-bottom: 5px solid #14532d; width: 100%; margin-top: 10px; transition: 0.2s; }
        .start-btn:active { transform: translateY(4px); border-bottom-width: 0px; }

        .result-box { background: #1a1a1a; padding: 40px; border-radius: 20px; border: 2px solid #333; box-shadow: 0 20px 50px #000; width: 90%; max-width: 500px; }
        .reveal-cards { display: flex; gap: 10px; margin: 20px 0; justify-content: center; }
        .reveal-cards img { width: 80px; border-radius: 6px; box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .truth-glow img { box-shadow: 0 0 40px #10b981; border: 3px solid #10b981; }
        .liar-glow img { box-shadow: 0 0 40px #dc2626; border: 3px solid #dc2626; }

        .gun-big { font-size: 5rem; animation: gunShake 0.3s infinite; }
        @keyframes gunShake {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        .shot-result-box { text-align: center; animation: resultAppear 0.4s ease-out; }
        @keyframes resultAppear { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 10px 20px; border-radius: 20px; font-weight: bold; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 300; }
        .toast.show { opacity: 1; bottom: 50px; }

        .cards-left-badge {
            position: absolute;
            top: -8px; right: -8px;
            background: #f59e0b;
            color: #000;
            font-size: 0.7rem;
            font-weight: 900;
            width: 20px; height: 20px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #000;
            z-index: 5;
        }

        /* شاشة تفعيل الصوت */
        #audioUnlockScreen {
            position: fixed; inset: 0;
            background: rgba(5,5,5,0.97);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            text-align: center;
            padding: 30px;
        }
        #audioUnlockScreen h2 { font-size: 2rem; color: #f59e0b; }
        #audioUnlockScreen p { color: #aaa; font-size: 1rem; }
        #audioUnlockBtn {
            padding: 18px 50px;
            font-size: 1.4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #dc2626, #7f1d1d);
            color: white;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            border-bottom: 4px solid #450a0a;
            box-shadow: 0 6px 25px rgba(220,38,38,0.5);
            font-family: inherit;
        }
        #audioUnlockBtn:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <!-- شاشة تفعيل الصوت — مطلوبة في iOS/Safari -->
    <div id="audioUnlockScreen">
        <div style="font-size:4rem">🔫</div>
        <h2>LIAR'S BAR</h2>
        <p>اضغط للدخول وتفعيل الصوت</p>
        <button id="audioUnlockBtn" onclick="unlockAndEnter()">▶ دخول اللعبة</button>
    </div>

    <div class="top-bar">
        <div class="room-pin" id="pinDisplay" onclick="copyPin()">----</div>
        <div class="turn-indicator" id="turnIndicator">جاري الاتصال...</div>
        <div class="target-box"><span>المطلوب:</span><div class="target-img-container" id="targetDisplay"></div></div>
    </div>

    <div class="arena" id="gameArena">
        <div class="table"><div class="discard-pile" id="discardPile"></div></div>
        <div id="playersRing" style="width:100%; height:100%; position:absolute;"></div>
    </div>

    <div class="bottom-area">
        <div class="spectator-mode" id="spectatorMode"><h2>💀 أنت ميت</h2><p>وضع المشاهدة</p></div>
        <div class="controls" id="controls">
            <button class="btn btn-play" id="btnPlay" disabled onclick="playAction()">⬇️ انزل</button>
            <button class="btn btn-liar" id="btnLiar" disabled onclick="callLiar()">🤥 كذاب</button>
        </div>
        <div class="my-hand" id="myHand"></div>
    </div>

    <div class="overlay" id="overlay"><h2>جاري الاتصال...</h2></div>
    <div id="toast" class="toast">تم نسخ الكود ✅</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, push, get, remove, onChildAdded } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        // =============================================
        // الأصوات — نظام موحد لجميع المتصفحات بما فيها iOS/Safari
        // =============================================
        // نبني عناصر Audio مسبقاً لكن لا نشغلها أبداً قبل تفاعل المستخدم
        const audioFiles = [
            '1A.mp3', '2A.mp3', '3A.mp3', '4A.mp3',
            '1K.mp3', '2K.mp3', '3K.mp3', '4K.mp3',
            '1Q.mp3', '2Q.mp3', '3Q.mp3', '4Q.mp3',
            'kill.mp3', 'safe.mp3'
        ];
        const audioElements = {};
        audioFiles.forEach(file => {
            const a = new Audio(`sounds/${file}`);
            a.preload = 'auto';
            audioElements[file] = a;
        });

        let audioReady = false;
        let currentAudio = null;

        // يُستدعى من زر الدخول — يفعّل الصوت بضغطة المستخدم المباشرة
        window.unlockAndEnter = async function() {
            const btn = document.getElementById('audioUnlockBtn');
            btn.disabled = true;
            btn.textContent = '⏳ جاري التحميل...';

            // نشغّل صوتاً واحداً فقط بصوت صفر لفتح سياق الصوت في iOS
            try {
                const a = audioElements['kill.mp3'];
                a.volume = 0;
                await a.play();
                a.pause();
                a.currentTime = 0;
                a.volume = 1;
            } catch(e) {}

            audioReady = true;
            document.getElementById('audioUnlockScreen').style.display = 'none';
        };

        // تشغيل صوت — يوقف أي صوت حالي أولاً
        window.playSfx = function(filename) {
            if (!audioReady) return;
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            const a = audioElements[filename];
            if (!a) return;
            a.currentTime = 0;
            a.volume = 1;
            a.play().catch(() => {});
            currentAudio = a;
        };

        // =============================================
        // Firebase
        // =============================================
        const firebaseConfig = { apiKey: "AIzaSyB5CobIKfYdAz8jaabJpMQrGoqS9Ton28Y", authDomain: "buttons-f3501.firebaseapp.com", databaseURL: "https://buttons-f3501-default-rtdb.firebaseio.com", projectId: "buttons-f3501" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const pin = urlParams.get('pin');
        let myName = urlParams.get('name');
        const isHost = urlParams.get('role') === 'host';

        // مفتاح تخزين فريد لكل غرفة — يضمن هوية ثابتة عند إعادة فتح الصفحة
        const storageKey = `liars_v21_${pin}_myId`;
        let myId = localStorage.getItem(storageKey);
        if (!myId) { myId = "p_" + Date.now(); localStorage.setItem(storageKey, myId); }

        const rootRef = `liars_rooms/${pin}`;
        const myPlayerRef  = ref(db, `${rootRef}/players/${myId}`);
        const playersRef   = ref(db, `${rootRef}/players`);
        const stateRef     = ref(db, `${rootRef}/gameState`);
        const actionsRef   = ref(db, `${rootRef}/actions`);
        const eventsRef    = ref(db, `${rootRef}/events`);

        const CARD_IMGS = {
            'A':    'https://deckofcardsapi.com/static/img/AS.png',
            'K':    'https://deckofcardsapi.com/static/img/KH.png',
            'Q':    'https://deckofcardsapi.com/static/img/QD.png',
            'J':    'https://deckofcardsapi.com/static/img/X1.png',
            'Back': 'https://deckofcardsapi.com/static/img/back.png'
        };

        let gameState = { status: 'lobby', tableStack: [] };
        let players = {};
        let myHand = [];
        let selectedIndices = [];

        // =============================================
        // تسجيل اللاعب — مضمون يظهر فوراً للجميع
        // =============================================
        async function registerPlayer() {
            const snap = await get(myPlayerRef);
            if (!snap.exists()) {
                // لاعب جديد — اكتب بياناته مباشرة
                await set(myPlayerRef, {
                    name: myName,
                    isAlive: true,
                    hand: [],
                    bulletIndex: Math.floor(Math.random() * 6),
                    currentChamber: 0
                });
            } else {
                // لاعب عائد — حدّث اسمه فقط إذا احتجنا
                if (snap.val().name) myName = snap.val().name;
            }
            // بعد ضمان وجود البيانات ابدأ الاستماع
            startListeners();
        }

        function startListeners() {
            onValue(playersRef, (snap) => {
                players = snap.val() || {};
                const newHand = players[myId]?.hand || [];
                if (JSON.stringify(newHand) !== JSON.stringify(myHand)) {
                    myHand = newHand;
                    selectedIndices = [];
                }
                renderTable(); renderHand(); renderUI();
            });

            onValue(stateRef, (snap) => {
                gameState = snap.val() || { status: 'lobby', tableStack: [] };
                renderTable(); renderUI(); renderPile();
            });

            // مستمع الأحداث (رمي الأوراق + صوت الطلقة)
            onChildAdded(eventsRef, (snap) => {
                const ev = snap.val();
                const now = Date.now();
                if (!ev || !ev.time) return;

                if (ev.type === 'throw') {
                    if (now - ev.time > 4000) return;
                    animateThrow(ev.playerId, ev.count);
                    playSfx(`${Math.min(ev.count, 4)}${ev.target}.mp3`);
                }
                else if (ev.type === 'shoot_sound') {
                    if (now - ev.time > 3000) return;
                    playSfx(ev.died ? 'kill.mp3' : 'safe.mp3');
                }
            });
        }

        // ابدأ التسجيل فوراً عند تحميل الصفحة
        registerPlayer();

        // =============================================
        // منطق توزيع الأوراق
        // =============================================
        function buildSmartDeck(targetCard) {
            const COUNTS = { A: 6, K: 6, Q: 6 };
            let targetCards = Array(COUNTS[targetCard]).fill(targetCard);
            let otherCards = [];
            ['A', 'K', 'Q'].forEach(c => {
                if (c !== targetCard)
                    for (let i = 0; i < COUNTS[c]; i++) otherCards.push(c);
            });
            return { targetCards: shuffle(targetCards), otherCards: shuffle(otherCards) };
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function dealHands(aliveIds, targetCard) {
            const HAND_SIZE = 5;
            let { targetCards, otherCards } = buildSmartDeck(targetCard);
            let hands = {};
            aliveIds.forEach(id => { hands[id] = []; });

            shuffle([...aliveIds]).forEach(id => {
                if (targetCards.length > 0) hands[id].push(targetCards.pop());
            });

            const jokerRecipients = shuffle([...aliveIds]).slice(0, 2);
            jokerRecipients.forEach((id, idx) => {
                if (hands[id].length < HAND_SIZE) hands[id].push(['J', 'J'][idx]);
            });

            let fillPool = shuffle([...targetCards, ...otherCards]);
            aliveIds.forEach(id => {
                while (hands[id].length < HAND_SIZE && fillPool.length > 0)
                    hands[id].push(fillPool.pop());
                hands[id] = shuffle(hands[id]);
            });
            return hands;
        }

        // =============================================
        // منطق الهوست
        // =============================================
        if (isHost) {

            window.hostStartGame = async function() {
                const aliveIds = Object.keys(players).filter(id => players[id].isAlive).sort();
                if (aliveIds.length < 2) return alert("باقي لاعب واحد! اللعبة انتهت.");

                const target = ['A', 'K', 'Q'][Math.floor(Math.random() * 3)];
                const hands  = dealHands(aliveIds, target);
                const first  = aliveIds[Math.floor(Math.random() * aliveIds.length)];

                let updates = {};
                aliveIds.forEach(id => { updates[`players/${id}/hand`] = hands[id]; });
                updates['gameState'] = {
                    status: 'playing',
                    targetCard: target,
                    turnId: first,
                    tableStack: [],
                    lastPlay: null,
                    turnOrder: aliveIds,
                    roundEmptyHands: []
                };
                await update(ref(db, rootRef), updates);
            };

            window.hostStartMatch = async function() {
                let updates = {};
                Object.keys(players).forEach(id => {
                    updates[`players/${id}/isAlive`]       = true;
                    updates[`players/${id}/currentChamber`] = 0;
                    updates[`players/${id}/bulletIndex`]    = Math.floor(Math.random() * 6);
                    updates[`players/${id}/hand`]           = [];
                });
                await update(ref(db, rootRef), updates);
                setTimeout(() => window.hostStartGame(), 500);
            };

            onChildAdded(actionsRef, async (snap) => {
                const action = snap.val();
                const key    = snap.key;

                const psSnap        = await get(playersRef);
                const currentPlayers = psSnap.val() || {};
                const gsSnap        = await get(stateRef);
                const currentGS     = gsSnap.val() || gameState;
                const aliveIds      = (currentGS.turnOrder || Object.keys(currentPlayers).sort())
                                        .filter(id => currentPlayers[id]?.isAlive);

                try {
                    if (action.type === 'play') {
                        if (currentGS.status !== 'playing') {
                            remove(ref(db, `${rootRef}/actions/${key}`));
                            return;
                        }

                        const visualCards = action.cards.map(() => ({
                            rot: Math.random() * 60 - 30,
                            x:   Math.random() * 20 - 10,
                            y:   Math.random() * 20 - 10
                        }));

                        const evRef = push(eventsRef, {
                            type: 'throw', playerId: action.playerId,
                            count: action.cards.length, target: currentGS.targetCard,
                            time: Date.now()
                        });
                        setTimeout(() => remove(evRef), 4000);

                        const currIdx   = aliveIds.indexOf(action.playerId);
                        const nextId    = aliveIds[(currIdx + 1) % aliveIds.length];
                        const newLastPlay = {
                            playerId: action.playerId,
                            cards:    action.cards,
                            hadEmptyHand: (action.handLeft === 0)
                        };

                        await update(stateRef, {
                            tableStack: (currentGS.tableStack || []).concat(visualCards),
                            turnId:   nextId,
                            lastPlay: newLastPlay
                        });

                        if (action.handLeft === 0) {
                            const allEmpty = aliveIds.every(id =>
                                id === action.playerId || (currentPlayers[id]?.hand || []).length === 0
                            );
                            if (allEmpty) {
                                await update(stateRef, { status: 'redeal_notice', tableStack: [], lastPlay: null });
                                setTimeout(async () => {
                                    const newHands = dealHands(aliveIds, currentGS.targetCard);
                                    let reDeal = {};
                                    aliveIds.forEach(id => { reDeal[`players/${id}/hand`] = newHands[id]; });
                                    reDeal['gameState/status']    = 'playing';
                                    reDeal['gameState/tableStack'] = [];
                                    reDeal['gameState/lastPlay']   = null;
                                    reDeal['gameState/turnId']     = nextId;
                                    await update(ref(db, rootRef), reDeal);
                                }, 3000);
                            }
                        }
                    }

                    else if (action.type === 'liar') {
                        if (currentGS.status !== 'playing') {
                            remove(ref(db, `${rootRef}/actions/${key}`));
                            return;
                        }
                        const lastMove = currentGS.lastPlay;
                        if (!lastMove) {
                            remove(ref(db, `${rootRef}/actions/${key}`));
                            return;
                        }

                        let isLiar = (lastMove.cards || []).some(
                            card => card !== currentGS.targetCard && card !== 'J'
                        );
                        const victimId = isLiar ? lastMove.playerId : action.playerId;

                        await update(stateRef, {
                            status:        'reveal',
                            revealedCards: lastMove.cards,
                            isLiar:        isLiar,
                            victimId:      victimId,
                            victimName:    currentPlayers[victimId]?.name || '؟',
                            accused:       currentPlayers[lastMove.playerId]?.name || '؟',
                            accuser:       currentPlayers[action.playerId]?.name  || '؟',
                            msg: isLiar
                                ? `كشفناه! ${currentPlayers[lastMove.playerId]?.name} كذاب! 🤥`
                                : `صادق! ${currentPlayers[action.playerId]?.name} تسرّع! 😱`
                        });

                        setTimeout(async () => {
                            const freshPS     = await get(playersRef);
                            const freshPlayers = freshPS.val() || {};
                            const victim = freshPlayers[victimId];
                            if (!victim) return;

                            const died = (victim.currentChamber === victim.bulletIndex);

                            await update(stateRef, {
                                status:     'roulette',
                                victimId:   victimId,
                                victimName: victim.name
                            });

                            const soundEvRef = push(eventsRef, {
                                type:       'shoot_sound',
                                died:       died,
                                victimId:   victimId,
                                victimName: victim.name,
                                time:       Date.now()
                            });
                            setTimeout(() => remove(soundEvRef), 3000);

                            setTimeout(async () => {
                                await update(stateRef, {
                                    status:     'shot_result',
                                    died:       died,
                                    victimName: victim.name,
                                    victimId:   victimId
                                });

                                setTimeout(async () => {
                                    if (died) {
                                        await update(ref(db, `${rootRef}/players/${victimId}`), { isAlive: false });
                                        const snapAfter   = await get(playersRef);
                                        const afterPlayers = snapAfter.val() || {};
                                        const survivors   = Object.keys(afterPlayers).filter(id => afterPlayers[id]?.isAlive);
                                        if (survivors.length <= 1) {
                                            const winnerName = survivors[0] ? afterPlayers[survivors[0]]?.name : '؟';
                                            await update(stateRef, { status: 'winner', winner: winnerName });
                                        } else {
                                            window.hostStartGame();
                                        }
                                    } else {
                                        const newChamber = (victim.currentChamber || 0) + 1;
                                        await update(ref(db, `${rootRef}/players/${victimId}`), { currentChamber: newChamber });
                                        window.hostStartGame();
                                    }
                                }, 2000);
                            }, 7000);
                        }, 3500);
                    }

                } catch(e) { console.error("Host action error:", e); }
                remove(ref(db, `${rootRef}/actions/${key}`));
            });
        }

        // =============================================
        // تفاعلات اللاعب
        // =============================================
        function updateBtns() {
            const btnPlay = document.getElementById('btnPlay');
            const btnLiar = document.getElementById('btnLiar');
            if (gameState.turnId === myId && players[myId]?.isAlive) {
                btnPlay.disabled = selectedIndices.length === 0;
                btnLiar.disabled = (gameState.tableStack || []).length === 0 || !gameState.lastPlay;
            } else {
                btnPlay.disabled = true;
                btnLiar.disabled = true;
            }
        }

        window.playAction = () => {
            if (selectedIndices.length === 0) return;
            document.getElementById('btnPlay').disabled = true;
            const cards = selectedIndices.map(i => myHand[i]);
            myHand = myHand.filter((_, i) => !selectedIndices.includes(i));
            set(ref(db, `${rootRef}/players/${myId}/hand`), myHand);
            push(actionsRef, { type: 'play', playerId: myId, cards, handLeft: myHand.length });
            selectedIndices = [];
            renderHand();
        };

        window.callLiar = () => {
            if (!gameState.lastPlay) return;
            if (confirm("إذا كان صادقاً ستسحب الزناد أنت! متأكد؟")) {
                push(actionsRef, { type: 'liar', playerId: myId });
            }
        };

        window.triggerStart = () => { if (isHost) window.hostStartMatch(); };

        window.copyPin = () => {
            navigator.clipboard.writeText(pin).catch(() => {});
            const t = document.getElementById('toast');
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        };

        // =============================================
        // رسم الواجهة
        // =============================================
        function renderUI() {
            if (gameState.targetCard) {
                document.getElementById('targetDisplay').innerHTML =
                    `<img src="${CARD_IMGS[gameState.targetCard]}">`;
            }
            document.getElementById('pinDisplay').innerText = `PIN: ${pin}`;

            const turnInd = document.getElementById('turnIndicator');

            if (players[myId] && !players[myId].isAlive &&
                gameState.status !== 'lobby' && gameState.status !== 'winner') {
                document.getElementById('spectatorMode').style.display = 'flex';
                turnInd.innerHTML = "👀 وضع المشاهدة";
            } else {
                document.getElementById('spectatorMode').style.display = 'none';
                if (gameState.status === 'playing') {
                    if (gameState.turnId === myId) {
                        turnInd.innerHTML = `دورك الآن يا <span class="highlight">${myName}</span>!`;
                        turnInd.className = 'turn-indicator my-turn';
                    } else {
                        const tName = players[gameState.turnId]?.name || '...';
                        turnInd.innerHTML = `اللعب الآن عند: <span class="highlight">${tName}</span>`;
                        turnInd.className = 'turn-indicator';
                    }
                    updateBtns();
                }
            }

            const overlay = document.getElementById('overlay');

            if (gameState.status === 'lobby') {
                overlay.style.display = 'flex';
                const playersListHTML = Object.values(players).map(p => `
                    <div class="lobby-player">
                        <div class="lobby-avatar">👤</div>
                        <div class="lobby-name">${p.name}</div>
                    </div>`).join('');

                if (isHost) {
                    overlay.innerHTML = `
                        <div class="lobby-box">
                            <h2 style="color:#aaa">كود الغرفة (اضغط للنسخ):</h2>
                            <div class="room-code-display" onclick="copyPin()">${pin}</div>
                            <div class="copy-hint">تم انضمام ${Object.keys(players).length} لاعبين</div>
                            <div class="players-grid">${playersListHTML}</div>
                            <button class="start-btn" onclick="triggerStart()">🎲 بدء اللعبة</button>
                        </div>`;
                } else {
                    overlay.innerHTML = `
                        <div class="lobby-box">
                            <h2>أهلاً ${myName}</h2>
                            <p style="color:#aaa;">في انتظار الهوست...</p>
                            <div class="players-grid">${playersListHTML}</div>
                        </div>`;
                }
            }
            else if (gameState.status === 'playing') {
                overlay.style.display = 'none';
            }
            else if (gameState.status === 'redeal_notice') {
                overlay.style.display = 'flex';
                overlay.innerHTML = `
                    <div class="result-box" style="text-align:center;">
                        <h1 style="font-size:3rem">🃏</h1>
                        <h2 style="color:#f59e0b; margin:15px 0;">انتهت جميع الأوراق!</h2>
                        <p style="color:#aaa;">جاري إعادة التوزيع...</p>
                    </div>`;
            }
            else if (gameState.status === 'reveal') {
                overlay.style.display = 'flex';
                const glow = gameState.isLiar ? 'liar-glow' : 'truth-glow';
                const cardsHTML = (gameState.revealedCards || []).map(c =>
                    `<div class="${glow}">
                        <img src="${CARD_IMGS[c] || CARD_IMGS['Back']}" style="width:80px; display:block; border-radius:6px;">
                    </div>`
                ).join('');
                overlay.innerHTML = `
                    <div class="result-box">
                        <h1 style="color:${gameState.isLiar ? '#ef4444' : '#10b981'}; font-size:1.8rem; margin-bottom:15px;">
                            ${gameState.msg}
                        </h1>
                        <div class="reveal-cards">${cardsHTML}</div>
                    </div>`;
            }
            else if (gameState.status === 'roulette') {
                overlay.style.display = 'flex';
                overlay.innerHTML = `
                    <div class="result-box" style="text-align:center; border-color:#dc2626;">
                        <div class="gun-big">🔫</div>
                        <h2 style="margin-top:20px; color:#fcd34d; font-size:1.8rem;">
                            ${gameState.victimName || '...'}
                        </h2>
                        <p style="color:#888; margin-top:10px; font-size:1.1rem;">يسحب الزناد... 🥁</p>
                    </div>`;
            }
            else if (gameState.status === 'shot_result') {
                overlay.style.display = 'flex';
                if (gameState.died) {
                    overlay.innerHTML = `
                        <div class="result-box shot-result-box" style="border-color:#dc2626;">
                            <h1 style="font-size:5rem">💥</h1>
                            <h1 style="color:#ef4444; font-size:2rem; margin:10px 0;">مات ${gameState.victimName}</h1>
                            <p style="color:#aaa;">خرجت الرصاصة الحقيقية!</p>
                        </div>`;
                } else {
                    overlay.innerHTML = `
                        <div class="result-box shot-result-box" style="border-color:#10b981;">
                            <h1 style="font-size:4rem">😮‍💨</h1>
                            <h1 style="color:#10b981; font-size:2rem; margin:10px 0;">نجا ${gameState.victimName}</h1>
                            <p style="color:#aaa;">الغرفة كانت فارغة!</p>
                        </div>`;
                }
            }
            else if (gameState.status === 'winner') {
                overlay.style.display = 'flex';
                overlay.innerHTML = `
                    <div class="result-box" style="text-align:center;">
                        <h1 style="font-size:5rem">🏆</h1>
                        <h2 style="color:#fcd34d; font-size:2rem; margin:15px 0;">الفائز: ${gameState.winner}</h2>
                        ${isHost
                            ? `<button class="start-btn" style="margin-top:30px;" onclick="window.hostStartMatch()">🔄 بدء مباراة جديدة</button>`
                            : '<p style="color:#aaa;">في انتظار الهوست...</p>'
                        }
                    </div>`;
            }
        }

        function renderTable() {
            const container = document.getElementById('playersRing');
            container.innerHTML = '';
            const pKeys = Object.keys(players).sort();
            if (pKeys.length === 0) return;

            let myIndex = pKeys.indexOf(myId);
            if (myIndex === -1) myIndex = 0;
            const count = pKeys.length;

            pKeys.forEach((id, i) => {
                const relativeI = (i - myIndex + count) % count;
                const angle = (Math.PI / 2) - (relativeI / count) * (2 * Math.PI);
                const left  = 50 + Math.cos(angle) * 35;
                const top   = 50 + Math.sin(angle) * 35;

                const p       = players[id];
                const isActive = gameState.turnId === id ? 'active-turn' : '';
                const isDead   = !p.isAlive ? 'dead' : '';
                const isMe     = id === myId ? 'is-me' : '';
                const gunInfo  = p.isAlive ? `🔫 ${p.currentChamber || 0}/6` : '💀';

                const handCount = (p.hand || []).length;
                const badgeHTML = (handCount > 0 && gameState.status === 'playing')
                    ? `<div class="cards-left-badge">${handCount}</div>`
                    : '';

                const el = document.createElement('div');
                el.className = `player-seat ${isActive} ${isDead} ${isMe}`;
                el.id = `avatar-${id}`;
                el.style.left = `${left}%`;
                el.style.top  = `${top}%`;
                el.innerHTML  = `
                    <div class="avatar-container">
                        ${badgeHTML}
                        <div class="avatar"><span>👤</span></div>
                    </div>
                    <div class="p-name">${id === myId ? '(أنت) ' + p.name : p.name}</div>
                    <div class="p-gun">${gunInfo}</div>`;
                container.appendChild(el);
            });
        }

        window.animateThrow = function(playerId, count) {
            const avatar      = document.getElementById(`avatar-${playerId}`);
            const tableCenter = document.getElementById('discardPile');
            if (!avatar || !tableCenter) return;
            const startRect = avatar.getBoundingClientRect();
            const endRect   = tableCenter.getBoundingClientRect();

            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const card = document.createElement('div');
                    card.style.backgroundImage    = `url('${CARD_IMGS['Back']}')`;
                    card.style.backgroundSize     = 'contain';
                    card.style.backgroundRepeat   = 'no-repeat';
                    card.style.backgroundPosition = 'center';
                    card.className = 'flying-card-anim';
                    card.style.position = 'fixed';
                    card.style.left = `${startRect.left + 10}px`;
                    card.style.top  = `${startRect.top  + 10}px`;
                    document.body.appendChild(card);
                    setTimeout(() => {
                        card.style.left      = `${endRect.left + (Math.random() * 10 - 5)}px`;
                        card.style.top       = `${endRect.top  + (Math.random() * 10 - 5)}px`;
                        card.style.transform = `rotate(${Math.random() * 90 - 45}deg) scale(0.9)`;
                    }, 50);
                    setTimeout(() => card.remove(), 450);
                }, i * 150);
            }
        };

        function renderPile() {
            const pile  = document.getElementById('discardPile');
            const stack = gameState.tableStack || [];
            if (pile.childElementCount !== stack.length) {
                pile.innerHTML = '';
                stack.forEach((meta, i) => {
                    const card = document.createElement('div');
                    card.className    = 'thrown-card';
                    card.style.transform = `rotate(${meta.rot}deg) translate(${meta.x}px, ${meta.y}px)`;
                    card.style.zIndex = i;
                    pile.appendChild(card);
                });
            }
        }

        function renderHand() {
            const handDiv = document.getElementById('myHand');
            handDiv.innerHTML = '';
            if (!myHand || myHand.length === 0) return;
            myHand.forEach((cardCode, i) => {
                const img = document.createElement('img');
                img.src = CARD_IMGS[cardCode] || CARD_IMGS['Back'];
                const div = document.createElement('div');
                div.className = `hand-card ${selectedIndices.includes(i) ? 'selected' : ''}`;
                div.onclick   = () => toggleSelect(i);
                div.appendChild(img);
                handDiv.appendChild(div);
            });
        }

        window.toggleSelect = (i) => {
            if (gameState.status !== 'playing' || gameState.turnId !== myId || !players[myId]?.isAlive) return;
            if (selectedIndices.includes(i)) {
                selectedIndices = selectedIndices.filter(x => x !== i);
            } else {
                selectedIndices.push(i);
            }
            renderHand(); updateBtns();
        };

    </script>
</body>
